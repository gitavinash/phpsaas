  <text x="95" y="267" fill="#64748b" font-size="11">Full day tour exploring Ubud sacred monkey forest and lush green rice terraces...</text>

  <!-- Timeline Item 3 -->
  <circle cx="60" cy="315" r="8" fill="#0284c7"/>
  <rect x="80" y="300" width="480" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
