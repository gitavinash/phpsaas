<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="stdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#f8fafc"/>
  <rect x="40" y="30" width="520" height="100" rx="8" fill="url(#stdGrad)" stroke="#0284c7" stroke-width="2"/>
  <text x="65" y="75" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">BALI TROPICAL ESCAPE</text>
  <text x="65" y="100" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">6 NIGHTS / 7 DAYS • STANDARD TIMELINE</text>

  <!-- Timeline Item 1 -->
  <line x1="60" y1="150" x2="60" y2="350" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 4"/>
