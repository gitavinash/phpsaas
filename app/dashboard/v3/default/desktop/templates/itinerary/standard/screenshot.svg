  <rect x="80" y="150" width="480" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="95" y="172" fill="#0f172a" font-size="13" font-weight="800">Day 1: Arrival &amp; Sunset at Uluwatu Temple</text>
  <text x="95" y="192" fill="#64748b" font-size="11">Pick-up from Denpasar International Airport, check-in to private villa...</text>

  <!-- Timeline Item 2 -->
